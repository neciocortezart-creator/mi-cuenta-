<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Covey · Prioridades y plata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --ink: #0e1116;
      --muted: #6b7280;
      --line: rgba(14, 17, 22, .08);
      --accent: #1d4bff;
      --on-accent: #ffffff;
      --ok: #12805c;
      --danger: #d92d20;
      --r-lg: 24px;
      --r-md: 16px;
      --r-pill: 999px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d11;
        --surface: #14171d;
        --ink: #f2f4f7;
        --muted: #8b93a1;
        --line: rgba(255, 255, 255, .08);
        --accent: #4d73ff;
        --ok: #34d399;
        --danger: #f97066;
      }
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .muted{color:var(--muted);font-size:.85rem}
    svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 110px);display:grid;gap:24px}
    .top{display:flex;justify-content:space-between;align-items:center}
    h1{font-size:1.9rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
    h2{font-size:1rem;font-weight:600}
    .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s}
    .icon-btn:hover{background:var(--line)}

    /* Dinero */
    .balance{display:grid;gap:6px}
    .amount{font-size:3rem;font-weight:600;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
    .meter{height:4px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
    .meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .6s var(--ease)}
    .stats{display:flex;gap:28px;margin-top:6px}
    .stats dt{font-size:.78rem;color:var(--muted)}
    .stats dd{font-weight:600;font-variant-numeric:tabular-nums}

    /* Filtros */
    .filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
    .filters::-webkit-scrollbar{display:none}
    .chip{padding:8px 14px;border-radius:var(--r-pill);font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap;transition:all .2s var(--ease)}
    .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

    /* Tarjeta de foco */
    .focus{background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:22px;display:grid;gap:18px;animation:in .45s var(--ease)}
    .focus.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
    .focus-meta{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
    .focus-body{text-align:left;display:grid;gap:6px;color:inherit}
    .focus-body h2{font-size:1.6rem;font-weight:600;letter-spacing:-.025em;line-height:1.2}
    .focus-body p{font-size:.9rem;opacity:.8}
    .track{position:relative;height:52px;border-radius:var(--r-pill);background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;--dx:0px}
    .track span{font-size:.88rem;font-weight:500;padding-left:44px;opacity:.9}
    .knob{position:absolute;left:4px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;transform:translateX(var(--dx));transition:transform .3s var(--ease);touch-action:none}
    .track.drag .knob{transition:none}
    @keyframes in{from{opacity:0;transform:translateY(8px)}}

    /* Lista */
    .list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
    .row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
    .check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;color:transparent;transition:all .25s var(--ease)}
    .check svg{width:14px;height:14px;stroke-width:3}
    .row.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
    .row-main{text-align:left;display:grid;gap:2px;min-width:0}
    .row-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row-meta{font-size:.78rem;color:var(--muted)}
    .row-cost{font-weight:600;font-variant-numeric:tabular-nums}
    .row.done .row-title,.row.done .row-cost{color:var(--muted);text-decoration:line-through}
    .empty{padding:28px 0;text-align:center;color:var(--muted);font-size:.9rem}

    /* Barra de acciones */
    .dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 20px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,var(--bg) 40%)}
    .btn{height:50px;padding:0 20px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.92rem;transition:transform .15s var(--ease);display:inline-flex;align-items:center;justify-content:center}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
    .btn.danger{color:var(--danger)}
    .dock .btn{flex:1;max-width:200px}
    .dock .icon-btn-dock{flex:0 0 50px;height:50px;width:50px;padding:0;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}

    /* Modales */
    dialog{margin:auto auto 0;width:100%;max-width:480px;border:0;border-radius:28px 28px 0 0;background:var(--surface);color:var(--ink);padding:20px 20px calc(env(safe-area-inset-bottom) + 24px)}
    dialog[open]{animation:up .32s var(--ease)}
    dialog::backdrop{background:rgba(8,10,14,.45)}
    @keyframes up{from{transform:translateY(100%)}}
    form{display:grid;gap:16px}
    .sheet-head{display:flex;justify-content:space-between;align-items:center}
    h3{font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
    .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:var(--r-pill);padding:4px}
    .seg input{position:absolute;opacity:0}
    .seg span{display:block;text-align:center;padding:10px;border-radius:var(--r-pill);font-size:.88rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s var(--ease)}
    .seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .seg input:focus-visible+span{outline:2px solid var(--accent)}
    .field{display:grid;gap:6px;font-size:.82rem;color:var(--muted)}
    .field input,.field textarea{padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.05rem;transition:border-color .2s}
    .field input{height:52px}
    .field textarea{padding:14px 16px;resize:none;line-height:1.4}
    .field input:focus,.field textarea:focus{outline:0;border-color:var(--accent)}
    .detect{font-size:.82rem;color:var(--accent);margin-top:-8px}
    .sheet-actions{display:flex;gap:10px}
    .sheet-actions .btn{flex:1}

    .mail-preview{display:grid;gap:6px}
    .preview-box{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--r-md);padding:12px 14px;border:1px solid var(--line)}
    .preview-tag{font-size:.75rem;padding:4px 8px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-weight:600}
    .preview-tag.income{background:var(--ok)}
    .preview-box strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
    .preview-amount{font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}

    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,16px);display:flex;align-items:center;gap:16px;padding:12px 16px 12px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-size:.88rem;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:10;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .toast button{font-weight:600;color:var(--accent);filter:brightness(1.4)}

    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <p class="muted">Mi espacio</p>
      <h1>Prioridades</h1>
    </div>
    <button class="icon-btn" id="btnReset" aria-label="Borrar todo">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
  </header>

  <section class="balance" aria-label="Dinero">
    <p class="muted">Disponible</p>
    <p class="amount" id="free">$0</p>
    <div class="meter"><i id="bar"></i></div>
    <dl class="stats">
      <div><dt>Ingresos</dt><dd id="inc">$0</dd></div>
      <div><dt>Pagado</dt><dd id="paid">$0</dd></div>
    </dl>
  </section>

  <nav class="filters" id="filters" aria-label="Filtros">
    <button class="chip" data-f="ALL">Todas</button>
    <button class="chip" data-f="Q1">Urgentes</button>
    <button class="chip" data-f="ROCK">Clave</button>
    <button class="chip" data-f="Casa">Casa</button>
    <button class="chip" data-f="Trabajo">Trabajo</button>
    <button class="chip" data-f="Estudio">Estudio</button>
    <button class="chip" data-f="Familia">Familia</button>
  </nav>

  <section id="focus" aria-live="polite"></section>

  <section>
    <div class="list-head"><h2>Pendientes</h2><span class="muted" id="count"></span></div>
    <div id="list"></div>
  </section>
</main>

<div class="dock">
  <button class="btn primary" id="btnTask">Nueva tarea</button>
  <button class="btn" id="btnIncome">Registrar ingreso</button>
  <button class="btn icon-btn-dock" id="btnMail" title="Importar correo bancario" aria-label="Importar correo">
    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
  </button>
</div>

<dialog id="sheet">
  <form id="form" autocomplete="off">
    <div class="sheet-head">
      <h3 id="sheetTitle">Nueva tarea</h3>
      <button type="button" class="icon-btn" id="btnClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="seg" id="kindSeg" role="radiogroup" aria-label="Tipo">
      <label><input type="radio" name="kind" value="task" checked><span>Tarea o gasto</span></label>
      <label><input type="radio" name="kind" value="income"><span>Ingreso</span></label>
    </div>

    <label class="field">
      <span id="lblTitle">¿Qué es?</span>
      <input id="fTitle" type="text" placeholder="Pagar arriendo" required>
    </label>
    <p class="detect" id="detect" hidden></p>

    <label class="field">
      <span>Monto en CLP</span>
      <input id="fAmount" type="text" inputmode="numeric" placeholder="320.000">
    </label>

    <div class="sheet-actions">
      <button type="button" class="btn danger" id="btnDelete" hidden>Eliminar</button>
      <button type="submit" class="btn primary" id="btnSave">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="mailSheet">
  <form id="mailForm" autocomplete="off">
    <div class="sheet-head">
      <h3>Importar correo bancario</h3>
      <button type="button" class="icon-btn" id="btnMailClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <label class="field">
      <span>Pega el texto del correo bancario o notificación</span>
      <textarea id="mailText" rows="5" placeholder="Pega aquí el comprobante bancario..."></textarea>
    </label>

    <div class="mail-preview" id="mailPreview" hidden>
      <p class="muted">Detectado automáticamente:</p>
      <div class="preview-box">
        <span class="preview-tag" id="previewType"></span>
        <strong id="previewTitle"></strong>
        <span class="preview-amount" id="previewAmount"></span>
      </div>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn" id="btnPasteClip">Pegar portapapeles</button>
      <button type="submit" class="btn primary" id="btnSaveMail" disabled>Registrar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="js/format.js"></script>
<script src="js/classify.js"></script>
<script src="js/store.js"></script>
<script src="js/mail-parser.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
